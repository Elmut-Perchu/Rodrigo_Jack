<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Cache Control - Force browser to reload JS files on every load (dev mode) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="stylesheet" href="../style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>VS Mode - Lobby</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;

            /* style.css, loaded above, pins the body to the viewport with
               height:100vh and overflow:hidden so the Adventure game world
               cannot scroll. A menu is not a game world: taller content was
               simply clipped, with no way to reach it. Undo both here.

               align-items is flex-start rather than center because centring a
               flex item that overrules its container clips the *top* of it,
               which scrolling cannot recover. The auto margins on the panel
               below centre it whenever it fits and collapse when it does not. */
            height: auto;
            overflow-y: auto;
            padding: 24px 0;
            box-sizing: border-box;
        }

        /* "3, 2, 1..." once everyone is ready - mirrors the arena's own
           countdown overlay (views/vs_game.html #countdown-overlay). */
        .lobby-countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2500;

            /* Announces the start without taking the room over. Drawn as a
               full-screen veil it swallowed every click underneath it, so the
               last seconds before a match - exactly when there is something to
               say - were the seconds nobody could type in the chat. */
            pointer-events: none;
            background-color: transparent;
        }

        .lobby-countdown-number {
            font-size: 64px;
            color: #f39c12;
            /* No veil behind it any more, so the digit carries its own
               legibility over whatever it happens to sit on. */
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.95),
                         3px 3px 0 rgba(0, 0, 0, 0.9),
                         -3px -3px 0 rgba(0, 0, 0, 0.9);
            opacity: 0.92;
        }

        .lobby-container {
            /* Auto margins centre the panel when there is room and
               collapse to nothing when there is not, so a long list
               scrolls from its very first row. */
            margin: auto 0;
            width: 90%;
            max-width: 1200px;
            background-color: rgba(44, 62, 80, 0.9);
            border: 4px solid #ecf0f1;
            border-radius: 10px;
            padding: 2rem;
        }

        .lobby-header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 1rem;
        }

        .lobby-header h1 {
            font-size: 2rem;
            margin: 0;
            color: #e74c3c;
        }

        .lobby-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        .players-section {
            background-color: rgba(52, 73, 94, 0.8);
            border: 2px solid #95a5a6;
            border-radius: 8px;
            padding: 1.5rem;
        }

        .players-section h2 {
            font-size: 1.2rem;
            margin-top: 0;
            color: #3498db;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .player-slot {
            background-color: rgba(44, 62, 80, 0.6);
            border: 2px dashed #7f8c8d;
            border-radius: 5px;
            padding: 1rem;
            text-align: center;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .player-slot.occupied {
            border: 2px solid #2ecc71;
            background-color: rgba(46, 204, 113, 0.2);
        }

        .player-slot.host {
            border-color: #f39c12;
            background-color: rgba(243, 156, 18, 0.2);
        }

        .player-name {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .player-status {
            font-size: 0.7rem;
            color: #95a5a6;
        }

        .chat-section {
            background-color: rgba(52, 73, 94, 0.8);
            border: 2px solid #95a5a6;
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .chat-section h2 {
            font-size: 1.2rem;
            margin-top: 0;
            color: #9b59b6;
        }

        .chat-messages {
            flex: 1;
            background-color: rgba(44, 62, 80, 0.6);
            border: 1px solid #7f8c8d;
            border-radius: 5px;
            padding: 1rem;
            margin-bottom: 1rem;
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 0.7rem;
            line-height: 1.6;
        }

        .chat-message {
            margin-bottom: 0.8rem;
        }

        .chat-message .username {
            color: #3498db;
        }

        .chat-message .system {
            color: #f39c12;
            font-style: italic;
        }

        .chat-input-container {
            display: flex;
            gap: 0.5rem;
        }

        .chat-input {
            flex: 1;
            padding: 0.8rem;
            border: 2px solid #7f8c8d;
            border-radius: 5px;
            background-color: rgba(44, 62, 80, 0.8);
            color: white;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 0.7rem;
        }

        .chat-send-btn {
            padding: 0.8rem 1.5rem;
            background-color: #9b59b6;
            border: none;
            border-radius: 5px;
            color: white;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 0.7rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .chat-send-btn:hover {
            background-color: #8e44ad;
        }

        .lobby-controls {
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lobby-info {
            font-size: 0.8rem;
            color: #95a5a6;
        }

        .lobby-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 5px;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-back {
            background-color: #95a5a6;
            color: white;
        }

        .btn-back:hover {
            background-color: #7f8c8d;
        }

        .btn-ready {
            background-color: #2ecc71;
            color: white;
        }

        .btn-ready:hover {
            background-color: #27ae60;
        }

        .btn-start {
            background-color: #e74c3c;
            color: white;
        }

        .btn-start:hover {
            background-color: #c0392b;
        }

        .btn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* --- AI slots and team layout --- */
        .player-slot.bot {
            border: 2px solid #9b59b6;
            background-color: rgba(155, 89, 182, 0.18);
        }

        .btn-slot-add,
        .btn-slot-remove {
            margin-top: 0.6rem;
            padding: 0.45rem 0.7rem;
            border: none;
            border-radius: 4px;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 0.55rem;
            cursor: pointer;
            color: white;
        }

        .btn-slot-add {
            background-color: #9b59b6;
        }

        .btn-slot-add:hover {
            background-color: #8e44ad;
        }

        .btn-slot-remove {
            background-color: #7f8c8d;
        }

        .btn-slot-remove:hover {
            background-color: #c0392b;
        }

        .lobby-picker {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .lobby-picker-label {
            font-size: 0.6rem;
            color: #95a5a6;
            min-width: 70px;
        }

        .lobby-picker-options {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .picker-option {
            padding: 0.45rem 0.7rem;
            border: 2px solid #7f8c8d;
            border-radius: 4px;
            background-color: rgba(44, 62, 80, 0.8);
            color: #ecf0f1;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 0.55rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .picker-option:hover {
            border-color: #bdc3c7;
        }

        .picker-option.selected {
            border-color: #9b59b6;
            background-color: rgba(155, 89, 182, 0.3);
        }

        .team-badge {
            font-size: 0.5rem;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            margin-bottom: 0.4rem;
            letter-spacing: 1px;
        }

        .team-badge.team-1 {
            background-color: rgba(52, 152, 219, 0.35);
            color: #85c1e9;
        }

        .team-badge.team-2 {
            background-color: rgba(231, 76, 60, 0.35);
            color: #f1948a;
        }

        /* A slot is tinted by the side it fights for, so a 2v2 or a 3v1 reads
           at a glance. These override the generic occupied/host colours. */
        .player-slot.side-1 {
            border-color: #3498db;
            background-color: rgba(52, 152, 219, 0.22);
        }

        .player-slot.side-2 {
            border-color: #e74c3c;
            background-color: rgba(231, 76, 60, 0.22);
        }

        .player-slot.pickable {
            cursor: pointer;
        }

        .player-slot.pickable:hover {
            filter: brightness(1.25);
        }

        .lobby-hint {
            font-size: 0.55rem;
            color: #95a5a6;
            margin-top: 0.9rem;
            font-style: italic;
        }

        .room-code {
            background-color: rgba(52, 152, 219, 0.3);
            border: 2px solid #3498db;
            border-radius: 5px;
            padding: 0.8rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .room-code span {
            color: #3498db;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <!-- Framework will mount reactive lobby UI here -->
    <script type="module" src="../core/ui-framework/lobby_app.js"></script>
</body>

</html>
