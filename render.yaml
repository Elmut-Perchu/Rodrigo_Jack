# render.yaml - Render Blueprint for the two Go backends
#
# Deploy via Render's dashboard: New -> Blueprint -> pick this repo. Render
# reads this file and creates both services below. The frontend (static
# HTML/JS) is NOT deployed here - it goes to Vercel/Netlify separately, and
# core/config.js already points at the service names used below.
#
# Free plan services spin down after 15 min idle and take up to ~50s to wake
# on the next request - core/ui/wake_overlay.js covers that in the client.
#
# REGION: both services declare frankfurt. Left unset, Render deploys to
# oregon, and that is what happened here - the services sat in us-west1 while
# the players are in France. Measured from Marseille, the round trip to the
# origin was 263ms on average (min 173, max 602), against 42ms to reach
# Cloudflare's local edge. That single fact was larger than every millisecond
# won by tuning the tick rate and the playout buffer put together.
#
# Render's own docs: "This value cannot be modified after the service is
# created." So changing these lines is not enough on its own - the services
# have to be recreated for it to take effect. Nothing durable is lost by that:
# neither service declares a disk or a database, and the score API keeps its
# table in memory, so it is already emptied by every spin-down.

services:
  - type: web
    name: rodrigo-jack-score-api
    runtime: go
    plan: free
    region: frankfurt
    rootDir: .
    autoDeploy: true
    buildCommand: go build -o app .
    startCommand: ./app
    healthCheckPath: /health

  - type: web
    name: rodrigo-jack-vs-server
    runtime: go
    plan: free
    region: frankfurt
    rootDir: server
    autoDeploy: true
    buildCommand: go build -o app .
    startCommand: ./app
    # Answers with the commit the running binary was built from, so "the fix
    # does not work" and "the fix is not deployed yet" can be told apart
    # without guessing. See buildRevision() in server/main.go.
    healthCheckPath: /health
    envVars:
      # Set this once Vercel/Netlify gives you the frontend URL, e.g.
      # https://rodrigo-jack.vercel.app - comma-separate multiple origins.
      - key: ALLOWED_ORIGINS
        sync: false
